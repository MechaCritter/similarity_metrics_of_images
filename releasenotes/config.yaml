default_branch: main
collapse_pre_releases: true
pre_release_tag_re: (?P<pre_release>-(?:[ab]|rc)+\d*)$
prelude_section_name: highlights
# Releases up to and including 0.9.3 are documented in the frozen CHANGELOG.md
# and carry no note files, so reports start just below them rather than walking
# the whole tag history. reno rejects a revision that does not exist yet
# ("earliest-version set to unknown revision"), so this has to name a tag that
# is already pushed, not the next release. Versions with no notes are left out
# of a report, so 0.9.2 and 0.9.3 never appear.
earliest_version: v0.9.2
template: |
  ---
  highlights: >
      Replace this text with content to appear at the top of the section for
      this release. Not every release note requires highlights, use this
      section only to describe major features or notable changes.
  upgrade:
    - |
      List upgrade notes here, or remove this section. Upgrade notes should be
      rare: only list known or potential breaking changes, or major changes
      that require user action before the upgrade. Notes here must include
      steps that users can follow to 1. know if they are affected and
      2. handle the change gracefully on their end.
  features:
    - |
      List new features here, or remove this section.
  enhancements:
    - |
      List new behavior that is too small to be considered a new feature, or
      remove this section.
  performance:
    - |
      Describe a measurable speed or memory improvement here, or remove this
      section. State the benchmark that was run and the before and after
      numbers.
  issues:
    - |
      List known issues here, or remove this section. For example, if some
      change is experimental or known not to work in some cases, mention it
      here.
  deprecations:
    - |
      List deprecation notes here, or remove this section. Deprecations should
      not be used for something that is removed in the release, use the upgrade
      section instead. A deprecation should allow users time to make the
      changes needed for the removal to happen in a future release.
  security:
    - |
      Add security notes here, or remove this section.
  fixes:
    - |
      Add normal bug fixes here, or remove this section.

# The order here is the order the sections appear in a report.
#
# DO NOT REMOVE an entry once a merged note has used it: 'reno lint' reads
# every note reachable from the history and fails on a section name it does not
# recognise. Renaming the heading text is safe, dropping the key is not.
sections:
  # The highlights section is implicitly included.
  - [upgrade, Upgrade Notes]
  - [features, New Features]
  - [enhancements, Enhancement Notes]
  - [performance, Performance]
  - [issues, Known Issues]
  - [deprecations, Deprecation Notes]
  - [security, Security Notes]
  - [fixes, Bug Fixes]
