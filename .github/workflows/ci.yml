name: CI

on:
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  types:
    # 1. MyPy strict type checking
    name: "Type check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group types --extra nn

      - name: Run mypy
        run: uv run --group types mypy pyvisim/

  # 2: ruff lint + format check
  fmt-check:
    name: "Format & lint check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group fmt

      - name: Check lint
        run: uv run --group fmt ruff check .

      - name: Check format
        run: uv run --group fmt ruff format --check .

  # 3: pytest unit tests with coverage
  tests:
    name: "Unit tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Pin torchvision's checkpoint directory so the cache steps below restore
      # it to the same place on every runner OS.
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group test --extra nn

      # The dataset lands in the platform-specific user cache directory.
      - name: Resolve the dataset cache directory
        id: dataset-cache
        shell: bash
        run: |
          set -euo pipefail
          path="$(uv run --no-sync python .github/scripts/prefetch_assets.py --print-cache-dir)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # The Oxford Flowers archive is a fixed download, so the key is a constant
      # and every run is expected to hit it. Bump '-v1' to force a re-download.
      - name: Restore the Oxford Flowers dataset
        uses: actions/cache@v6
        with:
          path: ${{ steps.dataset-cache.outputs.path }}
          key: pyvisim-dataset-${{ runner.os }}-v1

      # torchvision resolves checkpoint URLs per version, so key the weights on
      # the locked dependency set and fall back to the newest older entry.
      - name: Restore the pretrained backbone weights
        uses: actions/cache@v6
        with:
          path: ${{ env.TORCH_HOME }}
          key: pyvisim-torch-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: pyvisim-torch-${{ runner.os }}-

      - name: Run pytest with coverage
        run: uv run --group test pytest -m "not slow"

  # 4: slow integration tests
  slow-tests:
    name: "Slow tests (${{ matrix.os }})"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-slow')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # See the unit test job: both caches are restored to fixed paths. The slow
      # suite also pulls CLIP checkpoints from the Hugging Face hub.
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --group test --extra nn

      - name: Resolve the dataset cache directory
        id: dataset-cache
        shell: bash
        run: |
          set -euo pipefail
          path="$(uv run --no-sync python .github/scripts/prefetch_assets.py --print-cache-dir)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Restore the Oxford Flowers dataset
        uses: actions/cache@v6
        with:
          path: ${{ steps.dataset-cache.outputs.path }}
          key: pyvisim-dataset-${{ runner.os }}-v1

      - name: Restore the pretrained backbone weights
        uses: actions/cache@v6
        with:
          path: ${{ env.TORCH_HOME }}
          key: pyvisim-torch-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: pyvisim-torch-${{ runner.os }}-

      # The CLIP checkpoints are selected by the registry, so re-download only
      # when that registry changes.
      - name: Restore the CLIP checkpoints
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: pyvisim-clip-${{ runner.os }}-${{ hashFiles('pyvisim/neural_networks/clip/_registry.py') }}
          restore-keys: pyvisim-clip-${{ runner.os }}-

      - name: Run slow tests
        run: uv run --group test pytest -m "slow"
