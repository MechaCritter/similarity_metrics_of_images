# Every pull request touching library code must carry a release note under
# releasenotes/notes/, created with 'make release-note NAME=...'. See
# CONTRIBUTING.md#release-notes.
#
# 'release_notes_skipper.yml' reports the same check name for pull requests the
# 'paths' filter below excludes, so this can be a required status check.

name: Check Release Notes

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - "**.py"
      - "**.pyx"
      - "**.pxd"
      - "**.pyi"
      - "**.h"
      - "**.cpp"
      - "pyproject.toml"
      - "!.github/**/*.py"
      - "!scripts/**/*.py"
      - "releasenotes/notes/*.yaml"

permissions:
  contents: read

jobs:
  reno:
    name: "Check release notes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # With the default value of 1, there are corner cases where
          # tj-actions/changed-files fails with a 'no merge base' error.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Get release note files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: releasenotes/notes/*.yaml

      - name: Check release notes
        if: steps.changed-files.outputs.any_changed == 'false' && !contains( github.event.pull_request.labels.*.name, 'ignore-for-release-notes')
        run: |
          # Changes limited to CI, docs or tests do not need a release note.
          if git log --pretty=%s origin/main..HEAD | grep -E '^(ci:|docs:|test:)' > /dev/null
          then
            echo "Skipping release note check for commits with 'ci:', 'docs:' or 'test:' tags."
          else
            echo "::error::The release notes file is missing, please add one or attach the label 'ignore-for-release-notes' to this PR."
            exit 1
          fi

      # reno is run through 'uvx' so that linting a YAML file does not build the
      # compiled extensions of this package.
      - name: Verify release notes formatting
        if: steps.changed-files.outputs.any_changed == 'true' && !contains( github.event.pull_request.labels.*.name, 'ignore-for-release-notes')
        run: uvx --from 'reno<5' --with 'dulwich>=0.21.0,<1.0.0' reno lint .  # reno lint takes no file list

      - name: Check reStructuredText code formatting
        if: steps.changed-files.outputs.any_changed == 'true' && !contains( github.event.pull_request.labels.*.name, 'ignore-for-release-notes')
        shell: python
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          import os

          files = os.environ["CHANGED_FILES"].split()
          errors = []

          for filepath in files:
            with open(filepath) as f:
              for line_no, line in enumerate(f, start=1):
                # Check for triple backticks (Markdown code blocks)
                if "```" in line:
                  err = (f"Format error in {filepath}:{line_no}: "
                         "Found triple backticks. Use reStructuredText code block directive instead: .. code:: python")
                  errors.append(err)

                # Check for single backticks (Markdown inline code)
                if "`" in line.replace("```", "").replace("``", ""):
                  err = (f"Format error in {filepath}:{line_no}: "
                         "Found single backticks. Use double backticks (``code``) for inline code.")
                  errors.append(err)

          if errors:
              raise Exception("\n".join(errors))
