name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress production
# deployments finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 1. Build the Sphinx HTML documentation
    name: "Build documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # The 'nn' extra is installed so that autodoc documents the real
      # classes instead of mocked placeholders.
      - name: Install dependencies
        run: uv sync --group docs --extra nn

      # Binaries are kept out of the main history, so the sidebar logo lives
      # under 'docs/logo/' on the orphan 'assets' branch and is copied into the
      # static folder that furo resolves 'light_logo' and 'dark_logo' against.
      - name: Fetch the logo from the assets branch
        run: |
          set -euo pipefail
          dest="docs/sphinx/_static"
          if ! git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            echo "::warning::No assets branch yet. The docs build without a logo."
            exit 0
          fi
          git fetch --depth=1 origin assets
          if ! git ls-tree --name-only FETCH_HEAD docs/logo | grep -q .; then
            echo "::warning::The assets branch carries no 'docs/logo' folder."
            exit 0
          fi
          # '--strip-components=2' drops the 'docs/logo/' prefix so the files
          # land directly in the static folder.
          git archive FETCH_HEAD docs/logo | tar -x --strip-components=2 -C "$dest"
          echo "Copied $(find "$dest" -name '*.png' | wc -l) logo file(s)."

      - name: Build HTML documentation
        run: uv run --group docs sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html

      # The 'Benchmarks' workflow publishes them under 'benchmark/' on the
      # orphan 'assets' branch, and they are overlaid here so the absolute
      # '_IMAGE_BASE_URL' links in the docs resolve..
      - name: Overlay benchmark barplots from the assets branch
        run: |
          set -euo pipefail
          dest="docs/sphinx/_build/html/benchmarks"
          if git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            git fetch --depth=1 origin assets
            if ! git ls-tree --name-only FETCH_HEAD benchmark | grep -q .; then
              echo "::notice::The assets branch carries no 'benchmark/' folder yet."
              exit 0
            fi
            mkdir -p "$dest"
            # Only the 'benchmark/' folder belongs on Pages; the branch may
            # carry unrelated binaries. '--strip-components=1' drops that
            # prefix so the published URLs stay under '/benchmarks/'.
            git archive FETCH_HEAD benchmark | tar -x --strip-components=1 -C "$dest"
            echo "Overlaid $(find "$dest" -type f | wc -l) benchmark image(s)."
          else
            echo "::notice::No assets branch yet. Run the Benchmarks workflow once to generate it."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/sphinx/_build/html

  deploy:
    # 2. Deploy the built HTML to GitHub Pages
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
