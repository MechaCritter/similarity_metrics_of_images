fail_fast: true

# Vendored third-party code is kept byte-comparable with its upstream source,
# so no hook may touch anything under a _vendored folder.
exclude: '/_vendored/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast # checks Python syntax
      - id: check-json # checks JSON syntax
      - id: check-merge-conflict # checks for no merge conflict strings
      - id: check-shebang-scripts-are-executable # checks all shell scripts have executable permissions
      - id: check-toml # checks TOML syntax
      - id: check-yaml # checks YAML syntax
      - id: end-of-file-fixer # checks there is a newline at the end of the file
        exclude: '^pyvisim/structural/_ssim_kernels\.c$' # generated by Cython
      - id: mixed-line-ending # normalizes line endings
      - id: no-commit-to-branch # prevents committing to main
      - id: trailing-whitespace # trims trailing whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=mdx]
        exclude: '^pyvisim/structural/_ssim_kernels\.c$' # generated by Cython

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # examples/notebooks hold notebooks; the _ssim_kernels.c file is generated by Cython
        exclude: '(examples|notebooks|^pyvisim/structural/_ssim_kernels\.c$)'
        args: ["--toml", "pyproject.toml"]
        additional_dependencies:
          - tomli

  - repo: local
    hooks:
      # Release notes render as reStructuredText: inline code needs double
      # backticks. The 'Check Release Notes' workflow rejects Markdown
      # backticks, this hook repairs them first.
      - id: release-note-backticks
        name: release-note-backticks
        language: python
        entry: python scripts/release_note_backticks.py
        files: '^releasenotes/notes/.*\.yaml$'
        types: [text]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint-docker
        args: ["-ignore", "SC2102"]
