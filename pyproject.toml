[build-system]
requires = ["setuptools>=77.0.0", "wheel", "Cython>=3.0.0", "numpy", "pybind11>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvisim"
version = "0.9.2"
description = "A Python library for image similarity analysis using Image Embedders and Neural Networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nhat Huy Vu", email = "vunhathuy234@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Implementation :: CPython",
  ]
dependencies = [
    "numpy",
    "Pillow",
    "platformdirs",
    "safetensors",
    "scipy",
]

[project.optional-dependencies]
# Deep-learning features and models including DeepConvFeature, the datasets and
# neural_networks modules.
nn = [
    "torch",
    "torchvision",
    "huggingface_hub",
    "requests",
    "tqdm",
]

[project.urls]
Homepage = "https://mechacritter.github.io/Python-Visual-Similarity/"
Source = "https://github.com/MechaCritter/Python-Visual-Similarity"
Download = "https://pypi.org/project/pyvisim/#files"

[tool.setuptools.packages.find]
include = ["pyvisim", "pyvisim.*"]

[tool.setuptools.package-data]
pyvisim = [
    "res/logging_config.yaml",
    "py.typed",
    "structural/_kernel/*.pyx",
    "structural/_kernel/*.pyi",
    "features/_vendored/sift/*.pyx",
    "features/_vendored/sift/*.pxd",
    "image_store/_index/_bindings/*.cpp",
    "image_store/_index/_bindings/*.h",
    "image_store/_index/_bindings/*.pyi",
    "image_store/_index/_vendored/hnswlib/hnswlib/*.h",
    "image_store/_index/_vendored/hnswlib/python-bindings/*.cpp",
]

# Dependencies groups to isolate test env from production env
[dependency-groups]
types = [
  "mypy",
]
dead-code = [
  "vulture",
]
fmt = [
  "ruff",
]
test = [
    "pytest",
    "pytest-cov",
    # Reference implementation of the PSNR baseline tests
    # (skimage.metrics.peak_signal_noise_ratio).
    "scikit-image",
    "scipy",
    # Reference implementation for the clustering/PCA equivalence tests and
    # the from_sklearn conversion tests.
    "scikit-learn",
    # for tests/features/test_sift.py to download its reference image.
    "requests",
    # Reference external index of the ExternalSearchIndex tests
    "faiss-cpu",
]
docs = [
    "sphinx",
    "myst-parser",
    "furo",
]
# Regenerating the checked-in C sources of the Cython kernels (make build-ext)
build = [
    "cython",
    "setuptools",
    "pybind11>=3.0.0",
]
# Reference implementations and tooling for the notebooks/benchmark_*.ipynb
# notebooks and docs/structural/benchmarks/generate_benchmark.py; scikit-learn
# is the comparison baseline of the clustering/PCA benchmarks.
bench = [
    "scikit-image",
    "scikit-learn",
    "torchmetrics",
    "matplotlib",
    "nbclient",
    "ipykernel",
    "psutil",
]
# Release note management (reno). dulwich is reno's git backend.
release = [
    "reno<5",
    "dulwich>=0.21.0,<1.0.0",
]

# Per-platform wheel builds for the compiled extensions, run by the publish
# workflow (.github/workflows/publish_pypi.yml) via cibuildwheel.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# The published wheels run on machines other than the one that builds them, so
# the C++ extension is compiled without '-march=native' (see setup.py).
environment = { PYVISIM_NO_NATIVE = "1" }
# Skip 32-bit and musl targets: scipy ships no wheels for them.
skip = ["*-musllinux_*", "*_i686", "*-win32"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^build/", "^dist/", "^\\.venv/", "^venv/"]

# Vendored third-party code is kept byte-comparable with upstream and is not
# held to this project's typing standards.
[[tool.mypy.overrides]]
module = "pyvisim.features._vendored.*"
ignore_errors = true
ignore_missing_imports = true

# Third-party libraries that ship without type stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "sklearn.*",
  "torchvision.*",
  "tqdm.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88
# _vendored folders hold third-party code kept byte-comparable with upstream.
# Markdown is prose: recent ruff versions reformat the Python code blocks inside
# it, which re-wraps the hand-laid-out documentation examples at 'line-length'.
extend-exclude = ["*.ipynb", "*.md", "_vendored"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line-too-long (handled by the formatter)
]

[tool.ruff.lint.isort]
# Pin the first-party classification instead of leaving it to ruff's filesystem
# heuristic, which resolves these names against the checkout layout and does not
# agree across environments: CI sorted 'import pyvisim.<submodule>' into the
# third-party block while local runs kept it first-party, so 'ruff check' failed
# only in CI. Naming them here makes the sections deterministic everywhere.
known-first-party = ["pyvisim", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.codespell]
ignore-words-list = "Commun"
skip = "./examples,./notebooks,*/_vendored/*"  # jupyter notebooks; vendored third-party code

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always emit a coverage report at the end of every run, locally and in CI.
addopts = "--cov=pyvisim --cov-report=term-missing"
markers = [
  "slow: tests that download model weights or data (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["pyvisim"]
branch = true

[tool.coverage.report]
show_missing = true
